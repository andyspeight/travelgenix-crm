name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly-disclosed advisories surface even without a push.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  # Dependency vulnerabilities. Report-only for now: the current highs are all
  # transitive via Next 14 and their fix needs a Next major bump (tracked
  # separately). Once that lands, drop continue-on-error to make this a gate.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (high and above)
        continue-on-error: true
        run: npm audit --audit-level=high

  # Secret scanning — catch a key committed by accident. Free for public repos.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Static analysis (SAST) over the JS/TS surface.
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@v3
